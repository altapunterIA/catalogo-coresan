<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyers Stock · Coresan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red:#C8281E; --maroon:#5C1418; --maroon-2:#4A0F13; --yellow:#F0B429; --gold:#F2B526;
  --cream:#F5F0E8; --dark:#1A1A1A; --surface:#F5F4F1; --border:#E0DDD6; --gray:#6B6B6B;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Barlow',sans-serif; background:var(--surface); color:var(--dark); }

/* ── Página ── */
.top {
  position:sticky; top:0; z-index:10; background:rgba(26,26,26,.97);
  border-bottom:2px solid var(--red); color:#fff;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:0 16px; height:58px;
}
.top a { color:#fff; text-decoration:none; font-family:'Barlow Condensed'; font-weight:800; font-size:22px; }
.top a span { color:var(--red); }
.top small { font-size:12px; opacity:.7; }
.intro { max-width:1200px; margin:0 auto; padding:28px 16px 8px; }
.intro h1 { font-family:'Barlow Condensed'; font-weight:800; font-size:44px; line-height:1; letter-spacing:.5px; }
.intro h1 span { color:var(--red); }
.intro p { color:var(--gray); margin-top:8px; max-width:640px; }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 6px; }
.pill {
  border:1px solid var(--border); background:#fff; color:var(--dark); border-radius:999px;
  padding:7px 14px; font:600 13px 'Barlow'; cursor:pointer;
}
.pill.active { background:var(--dark); color:#fff; border-color:var(--dark); }
.count { font-size:13px; color:var(--gray); margin-top:4px; }

.grid {
  max-width:1200px; margin:0 auto; padding:16px 16px 60px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px;
}
.cell { cursor:pointer; }
.thumb {
  position:relative; width:100%; aspect-ratio:1080/1920; overflow:hidden;
  border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.10); background:#ddd;
  transition:transform .18s, box-shadow .18s;
}
.cell:hover .thumb { transform:translateY(-3px); box-shadow:0 8px 32px rgba(0,0,0,.16); }
.thumb .flyer { position:absolute; top:0; left:0; transform-origin:0 0; }
.cell figcaption { font-size:13px; margin-top:8px; display:flex; justify-content:space-between; gap:8px; }
.cell figcaption b { font-weight:600; }
.cell figcaption span { color:var(--gray); }

/* Lightbox */
.lb { position:fixed; inset:0; background:rgba(10,9,8,.92); z-index:50; display:none;
      align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:16px; }
.lb.open { display:flex; }
.lb img { max-height:calc(100vh - 110px); max-width:100%; border-radius:10px; }
.lb .bar { display:flex; gap:10px; }
.lb button, .lb a {
  background:var(--red); color:#fff; border:0; border-radius:8px; padding:10px 16px;
  font:600 14px 'Barlow'; text-decoration:none; cursor:pointer;
}
.lb .ghost { background:rgba(255,255,255,.12); }

/* ── FLYER 1080 x 1920 (estilo Coresan: rojo + hexágonos) ── */
.flyer {
  position:relative; width:1080px; height:1920px; overflow:hidden; background:#fff;
  font-family:'Barlow Condensed',sans-serif;
}
.fl-hero { position:absolute; left:0; top:0; width:1080px; height:1362px; background:#C7291D; overflow:hidden; }
.fl-hex { position:absolute; left:50%; top:760px; transform:translate(-50%,-50%); width:1200px; height:1200px; }
.fl-eyebrow { position:absolute; left:72px; top:290px; font-weight:700; font-size:34px; letter-spacing:5px; color:#F0B429; text-transform:uppercase; }
.fl-brandname {
  position:absolute; left:66px; top:330px; font-weight:800; color:#fff; line-height:1;
  font-size:210px; letter-spacing:1px; text-transform:uppercase; white-space:nowrap;
}
.fl-banner { position:absolute; right:52px; top:570px; transform:rotate(-3deg); transform-origin:100% 50%; display:flex; flex-direction:column; align-items:stretch; filter:drop-shadow(0 10px 18px rgba(0,0,0,.25)); }
.fl-banner-main {
  background:#F0B429; color:#111; font-weight:800; text-transform:uppercase; white-space:nowrap;
  padding:16px 44px 10px; font-size:78px; line-height:1;
}
.fl-banner-sub {
  background:#111; color:#fff; font-weight:700; font-size:30px; letter-spacing:5px; text-transform:uppercase;
  text-align:center; padding:12px 30px 12px; white-space:nowrap;
}
.fl-photo {
  position:absolute; left:50%; bottom:28px; transform:translateX(-50%);
  width:900px; height:540px; display:flex; align-items:flex-end; justify-content:center;
}
.fl-photo img { max-width:900px; max-height:540px; width:auto; height:auto; object-fit:contain; filter:drop-shadow(0 24px 26px rgba(0,0,0,.35)); }
.fl-photo img.tall { height:540px; }
.fl-photo img.wide { width:900px; }
.fl-info { position:absolute; left:72px; right:72px; top:1362px; padding-top:54px; }
.fl-info-eyebrow { font-weight:700; font-size:30px; letter-spacing:5px; color:#C7291D; text-transform:uppercase; }
.fl-info-text { font-family:'Barlow',sans-serif; font-weight:500; font-size:40px; color:#1A1A1A; margin-top:8px; }
.fl-rule { height:2px; background:#D9D6D0; margin:30px 0 34px; }
.fl-foot { display:flex; align-items:center; justify-content:space-between; }
.fl-logo { display:flex; align-items:center; gap:22px; }
.fl-logo svg { width:76px; height:76px; }
.fl-logo b { font-weight:800; font-size:44px; color:#1A1A1A; letter-spacing:.5px; }
.fl-contact { text-align:right; font-weight:700; font-size:26px; letter-spacing:5px; color:#1A1A1A; line-height:1.4; }

/* Modo exportación: flyers a tamaño real, uno debajo del otro */
body.export { background:#000; }
body.export .top, body.export .intro, body.export .lb { display:none; }
body.export .grid { display:block; padding:0; max-width:none; }
body.export .thumb, body.export .cell:hover .thumb { transform:none; width:1080px; height:1920px; aspect-ratio:auto; border-radius:0; box-shadow:none; }
body.export .thumb .flyer { transform:none !important; position:static; }
body.export figcaption { display:none; }

@media (max-width:520px) {
  .grid { grid-template-columns:repeat(2,1fr); gap:12px; }
  .intro h1 { font-size:34px; }
}
</style>
</head>
<body>
<div class="top">
  <a href="../">CORE<span>SAN</span></a>
  <small>Flyers stock · uso interno</small>
</div>

<section class="intro">
  <h1>FLYERS <span>STOCK</span></h1>
  <p>40 productos reales de nuestras marcas que todavía no están en el catálogo, listos para cuando salgan a producción. Sin etiquetas de oferta ni de fiestas. Tocá un flyer para verlo en grande y descargarlo.</p>
  <div class="pills" id="pills"></div>
  <div class="count" id="count"></div>
</section>

<main class="grid" id="grid"></main>

<div class="lb" id="lb">
  <img id="lbImg" alt="">
  <div class="bar">
    <a id="lbDl" download>Descargar PNG</a>
    <button class="ghost" id="lbClose">Cerrar</button>
  </div>
</div>

<script src="flyers.js"></script>
<script src="render.js"></script>
<script>
const EXPORT = new URLSearchParams(location.search).has('export');
if (EXPORT) document.body.classList.add('export');

const grid = document.getElementById('grid');
FLYERS.forEach((f, i) => {
  const fig = document.createElement('figure');
  fig.className = 'cell';
  fig.dataset.cat = f.cat;
  fig.innerHTML = `<div class="thumb">${flyerHTML(f, i)}</div>
    <figcaption><b>${esc(f.marca)} · ${esc(f.nombre)}</b><span>${codigo(i)}</span></figcaption>`;
  fig.addEventListener('click', () => openLb(i, f));
  grid.appendChild(fig);
});

/* Ajusta textos largos al ancho disponible */
function fitText(el, maxW, minPx) {
  let px = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > maxW && px > minPx) { px -= 2; el.style.fontSize = px + 'px'; }
}
function fitAll() {
  document.querySelectorAll('.flyer').forEach(fl => {
    fitText(fl.querySelector('.fl-brandname'), 950, 90);
    fitText(fl.querySelector('.fl-banner-main'), 700, 40);
    const t = fl.querySelector('.fl-info-text'); t.style.whiteSpace = 'nowrap'; fitText(t, 936, 28);
    const img = fl.querySelector('.fl-photo img');
    const sz = () => { const r = img.naturalWidth / img.naturalHeight; img.classList.add(r > 900/540 ? 'wide' : 'tall'); };
    img.complete ? sz() : img.addEventListener('load', sz);
  });
}
document.fonts.ready.then(fitAll);

/* Escala los flyers al ancho de cada miniatura */
function fit() {
  if (EXPORT) return;
  document.querySelectorAll('.thumb').forEach(t => {
    t.querySelector('.flyer').style.transform = `scale(${t.clientWidth / 1080})`;
  });
}
new ResizeObserver(fit).observe(grid);
fit();

/* Filtros */
const pills = document.getElementById('pills');
const cats = ['todos', ...new Set(FLYERS.map(f => f.cat))];
cats.forEach((c, k) => {
  const b = document.createElement('button');
  b.className = 'pill' + (k === 0 ? ' active' : '');
  b.textContent = c === 'todos' ? 'Todos' : CATEGORIAS[c].label;
  b.onclick = () => {
    pills.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    b.classList.add('active');
    let n = 0;
    grid.querySelectorAll('.cell').forEach(el => {
      const show = c === 'todos' || el.dataset.cat === c;
      el.style.display = show ? '' : 'none';
      if (show) n++;
    });
    setCount(n);
    fit();
  };
  pills.appendChild(b);
});
function setCount(n) { document.getElementById('count').textContent = `${n} flyer${n === 1 ? '' : 's'}`; }
setCount(FLYERS.length);

/* Lightbox con el PNG exportado */
const lb = document.getElementById('lb');
function openLb(i, f) {
  const src = `png/${codigo(i)}.png`;
  document.getElementById('lbImg').src = src;
  document.getElementById('lbImg').alt = f.nombre;
  const dl = document.getElementById('lbDl');
  dl.href = src;
  dl.download = `coresan-${codigo(i)}.png`;
  lb.classList.add('open');
}
document.getElementById('lbClose').onclick = () => lb.classList.remove('open');
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
